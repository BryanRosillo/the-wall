name: CI - Build and Test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

env:
  SONAR_CLOUD_TOKEN: ${{ secrets.SONAR_GENERAL_TOKEN }}

jobs:

  # ============================
  # Backend – PhraseService (.NET)
  # ============================
  backend-ci:
    name: Backend – PhraseService
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.102"

      - name: Restore dependencies
        run: dotnet restore backend/phrase-service

      - name: Install the SonarScanner for .NET tool
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
        
      - name: SonarCloud begin
        run: >
          dotnet sonarscanner begin
          /o:"darksoft"
          /k:"darksoft_the-wall-phrase-service"
          /d:sonar.token="$SONAR_CLOUD_TOKEN"
          /d:sonar.sources=backend/phrase-service
          /d:sonar.exclusions=frontend/**
          /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml

      - name: Build
        run: dotnet build backend/phrase-service --no-restore

      - name: Run tests with coverage
        run: dotnet-coverage collect "dotnet test backend/phrase-service" -f xml -o "coverage.xml"

      - name: SonarCloud end
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_CLOUD_TOKEN"
        
  # ============================
  # Frontend – React + TypeScript
  # ============================
  frontend-ci:
    name: Frontend 
    runs-on: ubuntu-latest

    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd frontend/the-wall
          npm install --ignore-scripts

      - name: Run tests with coverage
        run: |
          cd frontend/the-wall
          npm run test -- --coverage

      - name: Build frontend
        run: |
          cd frontend/the-wall
          npm run build

      - name: SonarCloud scan (Frontend)
        run: |
          cd frontend/the-wall
          npm run sonar -- \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=darksoft \
            -Dsonar.projectKey=darksoft_the-wall-frontend \
            -Dsonar.sources=src \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.token=$SONAR_CLOUD_TOKEN
